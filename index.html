<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,
   initial-scale=1.0">
  <title>Audio Visualizer - Proiect Multimedia</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div id="visualizer-container">
    
    <canvas id="audioCanvas"></canvas>
    
    <div id="bottom-panel">

      <div id="visualizer-controls">
        <input id="barHue" type="range" min="0" max="360" value="200" />

        <label for="barHue">Color</label>
        <span id="barHueValue">200</span>
        <label class="wave-toggle">
          <input id="rgbWaveToggle" type="checkbox" />Wave</label>
      </div>

      <div class="media-block" id="audio-block">
        <div class="controls-row" id="audio-controls">
          <span class="control-label">Audio:</span>

          <button type="button" id="btnAudioBack" class="btn btn-outline-light btn-sm">
            <i class="bi bi-skip-backward-fill"></i>
          </button>

          <button type="button" id="btnPlayAudio" class="btn btn-outline-light">
            <i class="bi bi-play-fill"></i>
          </button>

          <button type="button" id="btnAudioFwd" class="btn btn-outline-light btn-sm">
            <i class="bi bi-skip-forward-fill"></i>
          </button>

          <select id="audioSpeed" class="form-select form-select-sm speed-select">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
        </div>

        <div class="seek-row">
          <input id="audioSeek" type="range" min="0" max="1000" value="0" class="form-range">
          <span id="audioTime" class="time-label">0:00 / 0:00</span>
        </div>

        <div class="input-row" id="audio-input">

          <label for="audioFile">Load audio file:</label>
          <input type="file" id="audioFile" accept="audio/*">

        </div>
      </div>

      <div class="media-block" id="video-block">
        <div class="controls-row" id="video-controls">
          <span class="control-label">Video:</span>

          <button type="button" id="btnVideoBack" class="btn btn-outline-light btn-sm">
            <i class="bi bi-skip-backward-fill"></i>
          </button>

          <button type="button" id="btnPlayVideo" class="btn btn-outline-light">
            <i class="bi bi-play-fill"></i>
          </button>

          <button type="button" id="btnVideoFwd" class="btn btn-outline-light btn-sm">
            <i class="bi bi-skip-forward-fill"></i>
          </button>

          <select id="videoSpeed" class="form-select form-select-sm speed-select">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
        </div>

        <div class="seek-row">
          <input id="videoSeek" type="range" min="0" max="1000" value="0" class="form-range">
          <span id="videoTime" class="time-label">0:00 / 0:00</span>
        </div>
        <div class="input-row" id="video-input">
          <label for="videoBgFile">Load background video:</label>
          <input type="file" id="videoBgFile" accept="video/*">
        </div>
      </div>
    </div>


    <video id="bgVideo" muted loop playsinline>

    </video>

  </div>

  <script src="script.js"></script>
</body>

</html>
